[program:app]
  # --no-sync: setup.sh has already built the venv. Without it a lock/venv mismatch would
  # make the app resolve against PyPI at start, behind an nginx that is already serving.
  command=uv run --no-sync uvicorn app:app --host 127.0.0.1 --port 8050 --workers 1
  directory=/app
  autostart=true
  autorestart=true
  stdout_logfile=/dev/stdout
  stdout_logfile_maxbytes=0
  stderr_logfile=/dev/stderr
  stderr_logfile_maxbytes=0
